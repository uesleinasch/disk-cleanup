name: disk_cleanup
description: "Gerenciador de espaço em disco para Linux."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.6.0
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
