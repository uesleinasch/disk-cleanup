name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || fail "$TAG não é uma tag anotada."

          commit=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$commit" origin/production || fail "$TAG não está em production."

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$commit^" 2>/dev/null || echo v0.0.0)
          [ "$(printf '%s\n%s\n' "$previous" "$TAG" | sort -V | tail -n1)" = "$TAG" ] && [ "$previous" != "$TAG" ] \
            || fail "$TAG não é maior que a versão anterior ($previous)."

          version="${TAG#v}"
          pubspec=$(git show "$commit:pubspec.yaml" | sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          app=$(git show "$commit:lib/version.dart" | sed -nE "s/.*kAppVersion[^']*'([^']+)'.*/\1/p")
          [ "$pubspec" = "$version" ] || fail "pubspec.yaml está em $pubspec, a tag é $TAG."
          [ "$app" = "$version" ] || fail "lib/version.dart está em $app, a tag é $TAG."

          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Gerar AppImage
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: packaging/appimage/build_appimage.sh "$VERSION"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git cliff --latest --strip header > notes.md
          gh release create "$TAG" dist/*.AppImage --verify-tag --title "disk-cleanup $TAG" --notes-file notes.md --latest

  main-sync-reminder:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar intervalo do backup em main
        env:
          EVERY: ${{ vars.MAIN_SYNC_EVERY }}
          TAG: ${{ github.ref_name }}
        run: |
          every="$EVERY"
          if [ -z "$every" ] && [ -f .claude/conventions.json ]; then
            every=$(jq -r '.mainSyncEvery // empty' .claude/conventions.json)
          fi
          every="${every:-2}"

          pending=$(git tag -l 'v[0-9]*' --merged origin/production --no-merged origin/main | grep -cE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "### $pending release(s) publicadas desde o último backup em main (intervalo: $every)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pending" -ge "$every" ]; then
            echo "::notice::Abra o PR production → main: gh pr create --base main --head production --title \"chore(release): backup estável $TAG\""
          fi
